version: "3.9"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: whmcs_admin_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        depends_on:
            - mysql
            - postgres
            - redis
        networks:
            - whmcs

    nginx:
        image: nginx:alpine
        container_name: whmcs_admin_nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - whmcs

    mysql:
        image: mysql:8.4
        container_name: whmcs_admin_mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: whmcs_admin
            MYSQL_USER: whmcs
            MYSQL_PASSWORD: secret
            TZ: Asia/Dhaka
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - whmcs

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: whmcs_admin_phpmyadmin
        restart: unless-stopped
        depends_on:
            - mysql
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_USER: root
            PMA_PASSWORD: root
            UPLOAD_LIMIT: 512M
            MEMORY_LIMIT: 512M
        ports:
            - "8080:80"
        networks:
            - whmcs

    postgres:
        image: postgres:17
        container_name: whmcs_admin_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: whmcs_admin
            POSTGRES_USER: whmcs
            POSTGRES_PASSWORD: secret
            TZ: Asia/Dhaka
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - whmcs

    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: whmcs_admin_pgadmin
        restart: unless-stopped
        depends_on:
            - postgres
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@example.com
            PGADMIN_DEFAULT_PASSWORD: admin
            PGADMIN_CONFIG_SERVER_MODE: "False"
        ports:
            - "5050:80"
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        networks:
            - whmcs

    redis:
        image: redis:7-alpine
        container_name: whmcs_admin_redis
        restart: unless-stopped
        command: redis-server --appendonly yes
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - whmcs

volumes:
    mysql_data:
    postgres_data:
    pgadmin_data:
    redis_data:

networks:
    whmcs:
        driver: bridge
